<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090e1a"><title>Lanzarote 13.1</title><style>
:root{--bg:#090e1a;--card:#111a2b;--card2:#172238;--line:#263550;--text:#f2f5fb;--muted:#9badca;--faint:#60708d;--orange:#ff9d35;--blue:#7cc4ed;--green:#56d89b}*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(circle at 90% -10%,#1a3355 0,transparent 32rem),var(--bg);color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:20px 14px 80px}header{padding:18px 6px 14px}.eyebrow{color:var(--orange);font-weight:800;letter-spacing:.14em;font-size:11px}.hero{font-size:42px;line-height:.95;margin:10px 0 12px;font-weight:900;letter-spacing:-.05em}.sub{color:var(--muted);margin:0;font-size:14px}.race{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#10192a;color:var(--muted);font-size:12px}.pill strong{color:var(--text)}.progress-wrap{position:sticky;top:8px;z-index:5;background:rgba(9,14,26,.9);backdrop-filter:blur(12px);padding:10px 4px;border-radius:14px}.progress-label{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin-bottom:6px}.progress-label span:last-child{color:var(--orange)}.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#ffd072);transition:width .25s}.sync{font-size:11px;color:var(--faint);margin-top:5px;text-align:right}.week{background:linear-gradient(145deg,var(--card),#0f1727);border:1px solid var(--line);border-radius:18px;margin:14px 0;overflow:hidden;box-shadow:0 9px 30px rgba(0,0,0,.18)}.week.current{border-color:var(--orange);box-shadow:0 0 0 1px #ff9d3540,0 12px 35px #0006}.week.skipped{opacity:.56}.whead{padding:15px 16px 12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.weekno{font-size:20px;font-weight:900}.range{color:var(--muted);font-size:12px}.tag{font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;color:var(--orange);background:#ff9d3515;border:1px solid #ff9d3540;padding:5px 8px;border-radius:99px}.sessions{border-top:1px solid var(--line)}.session{display:grid;grid-template-columns:44px 1fr 38px;gap:8px;align-items:center;padding:13px 12px;border-bottom:1px solid #1e2a41;min-height:70px}.session:last-child{border:0}.day{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}.name{font-weight:800}.run .name{color:var(--blue)}.long .name{color:#a6ddfa}.race-day{background:#ff9d350f}.race-day .name{color:var(--orange);font-size:17px}.details{color:var(--muted);font-size:12px;margin-top:2px}.check{appearance:none;width:34px;height:34px;border-radius:11px;border:2px solid var(--line);background:transparent;display:grid;place-content:center;cursor:pointer}.check:after{content:"✓";font-weight:1000;font-size:19px;transform:scale(0);color:#07130e}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{transform:scale(1)}.session:has(.check:checked) .copy{opacity:.48;text-decoration-color:var(--faint)}.note{margin:0 14px 14px;padding:11px 12px;border-radius:12px;background:var(--card2);color:var(--muted);font-size:12px}.lift-list{display:none;margin:8px 0 0;padding:8px 10px;border-left:2px solid var(--line);color:var(--muted)}.lift.open .lift-list{display:block}.lift-list div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.lift-list span:last-child{white-space:nowrap;color:var(--text)}button.expand{all:unset;color:var(--orange);cursor:pointer;font-size:11px;font-weight:800;margin-top:5px}.refs{margin-top:26px}.refs h2{font-size:24px}.ref{border:1px solid var(--line);border-radius:13px;margin:9px 0;background:var(--card)}.ref summary{cursor:pointer;padding:14px 15px;font-weight:800;list-style:none}.ref summary::after{content:"+";float:right;color:var(--orange)}.ref[open] summary::after{content:"−"}.ref-body{padding:0 15px 14px;color:var(--muted);font-size:13px}.ref-body b{color:var(--text)}.ref-body p{margin:8px 0}.reset{display:block;margin:28px auto;color:var(--faint);background:none;border:0;text-decoration:underline;cursor:pointer;padding:12px}.offline{color:#ffbf72}@media(min-width:600px){main{padding-top:36px}.hero{font-size:56px}.session{grid-template-columns:48px 1fr 42px;padding:15px 16px}}
</style></head><body><main><header><div class="eyebrow">LANZAROTE HALF MARATHON</div><h1 class="hero">THE ROAD TO<br>13.1</h1><p class="sub">Three runs. Two lifts. Saturday hoops. One finish line.</p><div class="race"><span class="pill"><strong>DEC 5, 2026</strong></span><span class="pill"><strong>10:30 AM</strong> start</span><span class="pill">Puerto del Carmen → Costa Teguise</span></div></header><div class="progress-wrap"><div class="progress-label"><span>TRAINING PROGRESS</span><span id="pct">0%</span></div><div class="bar"><i id="bar"></i></div><div class="sync" id="sync">loading progress…</div></div><div id="weeks"></div><section class="refs"><h2>Keep close</h2><div id="refs"></div></section><button class="reset" id="reset">Reset all progress</button></main><script>
const API='';
const q={steady:['Steady',"Slightly quicker than easy, still controlled. Don't push."],intervals:['Intervals','6 × 3 min hard (3–4 words max), 2 min walk between. 10 min warm-up and cool-down.'],tempo:['Tempo','20–30 min continuous at comfortably hard. 10 min warm-up and cool-down.'],race:['Strides','Easy running with 4 × 30 sec at race pace. Wakes the legs up, costs nothing.']};
const raw=[
[1,'Aug 31 – Sep 6',1,1.5,1,'steady','',"Deliberately tiny. Week 1 is about turning up three times, not about fitness. It will feel like nothing — that's the design."],
[2,'Sep 7 – 13',2,2,2,'steady','',null],[3,'Sep 14 – 20',2,2,3,'steady','',"Still below what you can already do. If weeks 1–3 feel trivially easy, you can skip straight to week 4 — you had a 20–30 min base before any of this started."],
[4,'Sep 21 – 27',3,2,4,'steady','',null],[5,'Sep 28 – Oct 4',3,3,5,'steady','',null],[6,'Oct 5 – 11',3,2,4,'intervals','Cutback',"First cutback. Volume drops on purpose — this is when tendons and bones catch up to your lungs."],
[7,'Oct 12 – 18',3,3,6,'intervals','',"Long run passes an hour. Carry fluid with electrolytes from here on — every Sunday, no exceptions."],[8,'Oct 19 – 25',4,3,7,'intervals','',null],[9,'Oct 26 – Nov 1',4,3,8,'intervals','',"Past 75 min on Sunday. Start practising fuel: a gel or chews every 40–45 min. Your gut needs training as much as your legs."],
[10,'Nov 2 – 8',3,3,6,'intervals','Cutback',"Second cutback. A 4-mile easy run should feel routine by now — that's the signal it's working."],[11,'Nov 9 – 15',4,3,9,'tempo','',null],[12,'Nov 16 – 22',4,4,11,'tempo','Peak',"Longest run of the plan. Eleven is enough — taper freshness, race-day adrenaline, and the crowd cover the last two miles."],
[13,'Nov 23 – 29',4,3,8,'tempo','Taper','Taper begins. Upper body only in the gym from here.'],[14,'Nov 30 – Dec 6',3,2,13.1,'race','Race week',"Nothing new on race day. Not shoes, not breakfast, not gels. Start slower than feels right."]];
const lower={3:['Lift — lower · squat','Week 1 again with a little more on the bar.',[['Back squat','3 × 8, heavier'],['Bulgarian split squat','3 × 8 each'],['Romanian deadlift','3 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],4:['Lift — lower · deadlift','Heavier than week 2. Last of the easy weeks — enjoy it.',[['Deadlift or trap bar','3 × 8, heavier'],['Step-up','3 × 8 each'],['Hip thrust','3 × 10'],['Calf raise — straight, then bent knee','2 × 15 each'],['Pallof press · dead bug','2 × 10 each']]],5:['Lift — lower · squat','Heaviest squat of the block. From here running takes priority over adding weight.',[['Back squat','3 × 8, heaviest'],['Bulgarian split squat','3 × 8 each'],['Romanian deadlift','3 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],6:['Lift — lower · deload','Running cutback week, so everything comes down together.',[['Deadlift or trap bar','2 × 8, ~70%'],['Step-up','2 × 8 each'],['Calf raise','2 × 15'],['Side plank','2 × 30s each']]],7:['Lift — lower · squat',"Stop adding weight now — you're maintaining.",[['Back squat','3 × 8'],['Bulgarian split squat','2 × 8 each'],['Romanian deadlift','2 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],8:['Lift — lower · deadlift','Same weight as week 4. Maintaining, not chasing.',[['Deadlift or trap bar','3 × 8'],['Step-up','2 × 8 each'],['Hip thrust','2 × 10'],['Calf raise — straight, then bent knee','2 × 15 each'],['Pallof press · dead bug','2 × 10 each']]],9:['Lift — lower · squat',"If Thursday's run has felt wrecked lately, cut a set from the squat.",[['Back squat','3 × 8'],['Bulgarian split squat','2 × 8 each'],['Romanian deadlift','2 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],10:['Lift — full body · deload','The split ends here. One session a week from now on.',[['Deadlift or trap bar','2 × 8, ~70%'],['Bench press','2 × 8'],['Barbell or dumbbell row','2 × 8'],['Curl + triceps extension','2 × 10 each'],['Side plank','2 × 30s each']]],11:['Lift — full body','One session covering everything, ~42 min.',[['Back squat','3 × 8'],['Bench press','3 × 8'],['Barbell or dumbbell row','3 × 8'],['Bulgarian split squat','2 × 8 each'],['Calf raise','2 × 15'],['Arms + delts','2 × 10–15']]],12:['Lift — full body · light legs','Peak week. No heavy hinge and no split squats.',[['Goblet or front squat','2 × 8, moderate'],['Bench press','3 × 8'],['Pull-up or lat pulldown','3 × 8'],['Calf raise','2 × 15'],['Arms + delts','2 × 10–15'],['Dead bug','2 × 10 each']]],13:['Lift — upper, light',"Taper. Nothing that leaves your legs sore this close to the race.",[['Bench press','2 × 8'],['Barbell or dumbbell row','2 × 8'],['Arms','2 × 10 each'],['Lateral raise · face pull','2 × 12 · 2 × 15']]],14:['Full rest — no gym','Race week. Sleep in.',[]]};
const upper=[['Bench press','3 × 8'],['Barbell or dumbbell row','3 × 8'],['Overhead press','2 × 8'],['Pull-up or lat pulldown','2 × 8'],['Curl + triceps extension','3 × 10 each'],['Lateral raise','2 × 12'],['Face pull','2 × 15']];
const refs=[['How the week is built','Mon rest. Tue quality run. Wed lift. Thu easy run. Fri upper-body lift through week 9, then rest. Saturday morning basketball, kept chill. Sunday long run. The original plan had the weekend reversed; this version is built around your Saturday hoops.'],['Effort, not pace','<b>Easy/long:</b> full sentences without gasping. It should feel almost embarrassingly slow.<br><b>Steady:</b> a notch up, still controlled.<br><b>Intervals:</b> hard but controlled, three or four words before you need air.<br><b>Tempo:</b> comfortably hard. You could talk; you would not want to.'],['Morning window','Everything on weekdays fits inside an hour. Kit, shoes, watch, and keys out the night before. Under 60 min you do not need to eat first. The actual constraint is sleep, so rest mornings count as training.'],['Warm up · 5 min','3–5 min brisk walk or very slow jog. Then 10 leg swings each way, 10 walking lunges per side, hip circles, ankle rolls and calf pumps, and 30 sec each of skips or butt kicks. Do not static-stretch cold.'],['Long-run fuel','Carry electrolytes once the long run passes an hour. Past 75 min, practise a gel or chews every 40–45 min. Use the same setup you plan to use on race day.'],['When work gets brutal','Drop in this order: Wednesday lift, Thursday run, Tuesday quality run. Protect the Sunday long run above everything. If you sleep under five hours, skip the morning session. Never cram missed work into the next week.'],['Pain rule','General soreness and heavy legs can be normal. Sharp, localised, worsening pain, or pain that changes how you run means stop and rest 2–3 days.']];
let done=new Set(['week-1-skipped','week-2-skipped']); let saveTimer;
function sess(id,day,name,detail,kind='',list=[]){return `<div class="session ${kind} ${list.length?'lift':''}" data-id="${id}"><div class="day">${day}</div><div class="copy"><div class="name">${name}</div><div class="details">${detail}</div>${list.length?`<button class="expand">show exercises</button><div class="lift-list">${list.map(x=>`<div><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}</div>`:''}</div><input class="check" type="checkbox" aria-label="mark ${day} complete"></div>`}
function render(){const now=new Date(), start=new Date(2026,7,31), current=Math.max(1,Math.min(14,Math.floor((now-start)/604800000)+1));document.querySelector('#weeks').innerHTML=raw.map(w=>{const [n,range,tue,thu,long,qt,tag,note]=w;if(n<3)return `<article class="week skipped"><div class="whead"><div><div class="weekno">Week ${n}</div><div class="range">${range}</div></div><span class="tag">Skipped · 5K base</span></div></article>`;const quality=q[qt], wed=lower[n], fri=n<10?['Lift — upper',n===6?'Cutback week, ~25 min.':"No leg work — Sunday's long run needs fresh legs.",n===6?upper.slice(0,4).map(x=>[x[0],x[1].replace('3 ×','2 ×')]):upper]:['Rest — no gym',n===14?'Race week. Do nothing.':"The split has ended; recover for Sunday's long run.",[]];const race=n===14;return `<article class="week ${n===current?'current':''}" id="week-${n}"><div class="whead"><div><div class="weekno">${n===current?'THIS WEEK · ':''}Week ${n}</div><div class="range">${range}</div></div>${tag?`<span class="tag">${tag}</span>`:''}</div><div class="sessions">${sess(`w${n}-mon`,'Mon','Rest','Completely.','')}${sess(`w${n}-tue`,'Tue',`${tue} mi · ${quality[0]}`,quality[1],'run')}${sess(`w${n}-wed`,'Wed',wed[0],wed[1],'',wed[2])}${sess(`w${n}-thu`,'Thu',`${thu} mi · ${race?'Shakeout':'Easy'}`,race?'Short and loose. Optional if the legs feel heavy.':'Conversational — full sentences, or you are going too fast.','run')}${sess(`w${n}-fri`,'Fri',fri[0],fri[1],'',fri[2])}${sess(`w${n}-sat`,'Sat',race?'Rest · feet up':'Basketball',race?'Skip it this week. One week off will not hurt; a rolled ankle will.':'Morning hoops. Keep it chill, hydrate hard, and save your legs for Sunday.','')}${sess(`w${n}-sun`,'Sun',race?'13.1 mi · RACE DAY':`${long} mi · Long run`,race?'Saturday, Dec 5 at 10:30 AM. First three miles should feel too easy.':'All easy, slower than you think. This is the session that carries the plan.','long '+(race?'race-day':''))}</div>${note?`<p class="note">${note}</p>`:''}</article>`}).join('');document.querySelectorAll('.session').forEach(el=>{const cb=el.querySelector('.check');cb.checked=done.has(el.dataset.id);cb.onchange=()=>{cb.checked?done.add(el.dataset.id):done.delete(el.dataset.id);update();queueSave()};el.querySelector('.expand')?.addEventListener('click',e=>{el.classList.toggle('open');e.target.textContent=el.classList.contains('open')?'hide exercises':'show exercises'})});update();if(current>=3)setTimeout(()=>document.querySelector(`#week-${current}`)?.scrollIntoView({block:'center'}),100)}
function update(){const total=(14-2)*7, count=[...done].filter(x=>/^w/.test(x)).length,p=Math.round((count+14)/(total+14)*100);pct.textContent=p+'%';bar.style.width=p+'%'}
async function load(){if(!API){sync.textContent='saved on this phone';const x=localStorage.getItem('lanzarote-done');if(x)done=new Set(JSON.parse(x));render();return}try{const r=await fetch(API+'?t='+Date.now());if(!r.ok)throw 0;const d=await r.json();done=new Set(d.done||[]);sync.textContent='saved across devices';render()}catch{sync.innerHTML='<span class="offline">offline · changes saved on this phone</span>';const x=localStorage.getItem('lanzarote-done');if(x)done=new Set(JSON.parse(x));render()}}
function queueSave(){localStorage.setItem('lanzarote-done',JSON.stringify([...done]));sync.textContent='saving…';clearTimeout(saveTimer);saveTimer=setTimeout(save,500)}
async function save(){if(!API){sync.textContent='saved on this phone';return}try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:[...done],updatedAt:new Date().toISOString()})});if(!r.ok)throw 0;sync.textContent='saved across devices'}catch{sync.innerHTML='<span class="offline">offline · saved on this phone</span>'}}
refs.innerHTML=refs.map(x=>`<details class="ref"><summary>${x[0]}</summary><div class="ref-body"><p>${x[1]}</p></div></details>`).join('');reset.onclick=()=>{if(confirm('Clear every completed workout?')){done=new Set(['week-1-skipped','week-2-skipped']);render();queueSave()}};render();load();
</script></body></html>
