<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f0e"><title>Lanzarote 13.1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"><style>

.week:not(.current):not(.open) .sessions,.week:not(.current):not(.open) .note{display:none}
.week .wtoggle{all:unset;cursor:pointer;color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;padding:8px 2px}
.week .wtoggle:hover{color:var(--muted)}.week .wtoggle:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.week:not(.current) .whead{cursor:pointer}
button.expand{all:unset;color:var(--lava);cursor:pointer;font-size:11.5px;font-weight:700;margin-top:5px;padding:6px 2px}button.expand:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.offline{color:#ffb36b}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.load-anim header,.load-anim .today,.load-anim .raceweek,.load-anim .progress-wrap{animation:rise .5s ease-out both}.load-anim .progress-wrap{animation-delay:.08s}

</style></head><body><main class="load-anim"><header><div class="meta"><span><b>Lanzarote Half Marathon</b></span><span><b>Dec 5, 2026</b> · 10:30</span></div><h1 class="hero">The road<br>to <em>13.1</em></h1><p class="sub">Three runs. Two lifts. Saturday hoops. One finish line.</p><div class="count"><b id="days">–</b><span>days to Puerto del Carmen → Costa Teguise</span></div></header><section class="today" id="today" aria-label="Today's workout"></section><section class="raceweek" id="raceweek" aria-label="Race week"></section><div class="progress-wrap"><div class="progress-label"><span>Training progress</span><span id="pct">0%</span></div><div class="route"><div class="route-track"><div class="route-fill" id="fill"></div><div class="route-marker" id="marker"></div></div></div><div class="route-ends"><span>Puerto del Carmen</span><span>21.1 km</span><span>Costa Teguise</span></div><div class="sync"><span id="sync">loading progress…</span> · <span id="strava"></span></div></div><div id="weeks"></div><section class="refs"><h2>Keep close</h2><div id="refs"></div></section><button class="reset" id="reset">Reset all progress</button></main><script>

const raw=[
[1,'Aug 31 – Sep 6',1,1.5,1,'steady','',"Deliberately tiny. Week 1 is about turning up three times, not about fitness. It will feel like nothing — that's the design."],
[2,'Sep 7 – 13',2,2,2,'steady','',null],[3,'Sep 14 – 20',2,2,3,'steady','',"Still below what you can already do. If weeks 1–3 feel trivially easy, you can skip straight to week 4 — you had a 20–30 min base before any of this started."],
[4,'Sep 21 – 27',3,2,4,'steady','',null],[5,'Sep 28 – Oct 4',3,3,5,'steady','',null],[6,'Oct 5 – 11',3,2,4,'intervals','Cutback',"First cutback. Volume drops on purpose — this is when tendons and bones catch up to your lungs."],
[7,'Oct 12 – 18',3,3,6,'intervals','',"Long run passes an hour. Carry fluid with electrolytes from here on — every Sunday, no exceptions."],[8,'Oct 19 – 25',4,3,7,'intervals','',null],[9,'Oct 26 – Nov 1',4,3,8,'intervals','',"Past 75 min on Sunday. Start practising fuel: a gel or chews every 40–45 min. Your gut needs training as much as your legs."],
[10,'Nov 2 – 8',3,3,6,'intervals','Cutback',"Second cutback. A 4-mile easy run should feel routine by now — that's the signal it's working."],[11,'Nov 9 – 15',4,3,9,'tempo','',null],[12,'Nov 16 – 22',4,4,11,'tempo','Peak',"Longest run of the plan. Eleven is enough — taper freshness, race-day adrenaline, and the crowd cover the last two miles."],
[13,'Nov 23 – 29',4,3,8,'tempo','Taper','Taper begins. Upper body only in the gym from here.'],[14,'Nov 30 – Dec 6',3,2,13.1,'race','Race week',"Nothing new on race day. Not shoes, not breakfast, not gels. Start slower than feels right."]];
const lower={3:['Lift — lower · squat','Week 1 again with a little more on the bar.',[['Back squat','3 × 8, heavier'],['Bulgarian split squat','3 × 8 each'],['Romanian deadlift','3 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],4:['Lift — lower · deadlift','Heavier than week 2. Last of the easy weeks — enjoy it.',[['Deadlift or trap bar','3 × 8, heavier'],['Step-up','3 × 8 each'],['Hip thrust','3 × 10'],['Calf raise — straight, then bent knee','2 × 15 each'],['Pallof press · dead bug','2 × 10 each']]],5:['Lift — lower · squat','Heaviest squat of the block. From here running takes priority over adding weight.',[['Back squat','3 × 8, heaviest'],['Bulgarian split squat','3 × 8 each'],['Romanian deadlift','3 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],6:['Lift — lower · deload','Running cutback week, so everything comes down together.',[['Deadlift or trap bar','2 × 8, ~70%'],['Step-up','2 × 8 each'],['Calf raise','2 × 15'],['Side plank','2 × 30s each']]],7:['Lift — lower · squat',"Stop adding weight now — you're maintaining.",[['Back squat','3 × 8'],['Bulgarian split squat','2 × 8 each'],['Romanian deadlift','2 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],8:['Lift — lower · deadlift','Same weight as week 4. Maintaining, not chasing.',[['Deadlift or trap bar','3 × 8'],['Step-up','2 × 8 each'],['Hip thrust','3 × 10'],['Calf raise — straight, then bent knee','2 × 15 each'],['Pallof press · dead bug','2 × 10 each']]],9:['Lift — lower · squat',"If Thursday's run has felt wrecked lately, cut a set from the squat.",[['Back squat','3 × 8'],['Bulgarian split squat','2 × 8 each'],['Romanian deadlift','2 × 8'],['Calf raise — straight, then bent knee','2 × 15 each'],['Side plank · dead bug','2 × 30s · 2 × 10']]],10:['Lift — full body · deload','The split ends here. One session a week from now on.',[['Deadlift or trap bar','2 × 8, ~70%'],['Bench press','2 × 8'],['Barbell or dumbbell row','2 × 8'],['Curl + triceps extension','2 × 10 each'],['Side plank','2 × 30s each']]],11:['Lift — full body','One session covering everything, ~42 min.',[['Back squat','3 × 8'],['Bench press','3 × 8'],['Barbell or dumbbell row','3 × 8'],['Bulgarian split squat','2 × 8 each'],['Calf raise','2 × 15'],['Arms + delts','2 × 10–15']]],12:['Lift — full body · light legs','Peak week. No heavy hinge and no split squats.',[['Goblet or front squat','2 × 8, moderate'],['Bench press','3 × 8'],['Pull-up or lat pulldown','3 × 8'],['Calf raise','2 × 15'],['Arms + delts','2 × 10–15'],['Dead bug','2 × 10 each']]],13:['Lift — upper, light',"Taper. Nothing that leaves your legs sore this close to the race.",[['Bench press','2 × 8'],['Barbell or dumbbell row','2 × 8'],['Arms','2 × 10 each'],['Lateral raise · face pull','2 × 12 · 2 × 15']]],14:['Full rest — no gym','Race week. Sleep in.',[]]};

const refs=[['How the week is built','Mon rest. Tue quality run. Wed lift. Thu easy run. Fri upper-body lift through week 9, then rest. Saturday morning basketball, kept chill. Sunday long run. The original plan had the weekend reversed; this version is built around your Saturday hoops.'],['Effort, not pace','<b>Easy/long:</b> full sentences without gasping. It should feel almost embarrassingly slow.<br><b>Steady:</b> a notch up, still controlled.<br><b>Intervals:</b> hard but controlled, three or four words before you need air.<br><b>Tempo:</b> comfortably hard. You could talk; you would not want to.'],['Morning window','Everything on weekdays fits inside an hour. Kit, shoes, watch, and keys out the night before. Under 60 min you do not need to eat first. The actual constraint is sleep, so rest mornings count as training.'],['Warm up · 5 min','3–5 min brisk walk or very slow jog. Then 10 leg swings each way, 10 walking lunges per side, hip circles, ankle rolls and calf pumps, and 30 sec each of skips or butt kicks. Do not static-stretch cold.'],['Long-run fuel','Carry electrolytes once the long run passes an hour. Past 75 min, practise a gel or chews every 40–45 min. Use the same setup you plan to use on race day.'],['When work gets brutal','Drop in this order: Wednesday lift, Thursday run, Tuesday quality run. Protect the Sunday long run above everything. If you sleep under five hours, skip the morning session. Never cram missed work into the next week.'],['Pain rule','General soreness and heavy legs can be normal. Sharp, localised, worsening pain, or pain that changes how you run means stop and rest 2–3 days.']];
const rwPrep=[['Kit laid out, bib pinned the night before'],['Watch and phone charged'],['Gels or chews packed — the same ones you trained with'],['Breakfast 2–3 hours before the gun, nothing new'],['Electrolytes in the morning'],['First three miles slower than feels right']];
let done=new Set(['week-1-skipped','week-2-skipped']); let saveTimer;
const DAYS=['mon','tue','wed','thu','fri','sat','sun'];
function weekOf(d){const a=Date.UTC(START.getFullYear(),START.getMonth(),START.getDate()),b=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());return Math.floor((b-a)/604800000)+1}
function weekStart(n){const d=new Date(START);d.setDate(d.getDate()+(n-1)*7);return d}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sessionsForWeek(n){const w=raw.find(x=>x[0]===n),[wn,range,tue,thu,long,qt]=w,quality=q[qt],wed=lower[n],race=n===14;
const fri=n<10?{name:'Lift — upper',detail:n===6?'Cutback week, ~25 min.':"No leg work — Sunday's long run needs fresh legs.",list:n===6?upper.slice(0,4).map(x=>[x[0],x[1].replace('3 ×','2 ×')]):upper}:{name:'Rest — no gym',detail:n===14?'Race week. Do nothing.':"The split has ended; recover for Sunday's long run.",rest:true};
return[{id:`w${n}-mon`,day:'Mon',name:'Rest',detail:'Completely.',rest:true},
{id:`w${n}-tue`,day:'Tue',name:`${tue} mi · ${quality[0]}`,detail:quality[1],kind:'run',miles:tue},
{id:`w${n}-wed`,day:'Wed',name:wed[0],detail:wed[1],list:wed[2],rest:/rest/i.test(wed[0])},
{id:`w${n}-thu`,day:'Thu',name:`${thu} mi · ${race?'Shakeout':'Easy'}`,detail:race?'Short and loose. Optional if the legs feel heavy.':'Conversational — full sentences, or you are going too fast.',kind:'run',miles:thu},
Object.assign({id:`w${n}-fri`,day:'Fri'},fri),
race?{id:`w${n}-sat`,day:'Sat',name:'13.1 mi · RACE DAY',detail:'Saturday, Dec 5 at 10:30 AM. First three miles should feel too easy.',kind:'long race-day',miles:13.1}:{id:`w${n}-sat`,day:'Sat',name:'Basketball',detail:'Morning hoops. Keep it chill, hydrate hard, and save your legs for Sunday.'},
race?{id:`w${n}-sun`,day:'Sun',name:'Rest · feet up',detail:'You raced yesterday. Walk, eat, sleep.',rest:true}:{id:`w${n}-sun`,day:'Sun',name:`${long} mi · Long run`,detail:'All easy, slower than you think. This is the session that carries the plan.',kind:'long',miles:long}]}

function toggle(id,on){on?done.add(id):done.delete(id);document.querySelectorAll(`.session[data-id="${id}"] .check`).forEach(c=>c.checked=on);renderToday();update();queueSave()}
function paceStatus(now){const wn=weekOf(now);if(wn<3)return{cls:'pace-on',html:'Plan starts <b>Monday, Sep 14</b>'};if(wn>14)return null;
const map=allSessions(),dow=(now.getDay()+6)%7;let expected=0;map.forEach(s=>{if(s.rest)return;const sn=+s.id.match(/^w(\d+)-/)[1];if(sn<wn||(sn===wn&&s.date<=now))expected++});

const dow=(now.getDay()+6)%7,s=sessionsForWeek(wn)[dow];todayId=s.id;
const kindCls=s.kind&&s.kind.includes('race')?'race':(s.kind||'');
el.innerHTML=`<div class="t-label"><span>Today · ${now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</span><span>Week ${wn} of 14</span></div><div class="t-row"><div><div class="t-name ${kindCls}">${s.name}</div><div class="t-detail">${s.detail}</div></div><input class="check" type="checkbox" aria-label="mark today complete" ${done.has(s.id)?'checked':''}></div>${(()=>{const p=paceStatus(now);return p?`<div class="pace ${p.cls}"><span>${p.html}</span></div>`:''})()}`;
el.querySelector('.check').onchange=e=>toggle(s.id,e.target.checked)}
function renderRaceWeek(now){const el=document.getElementById('raceweek');if(weekOf(now)!==14)return;
document.body.classList.add('race-week');
const sessions=sessionsForWeek(14);
el.innerHTML=`<div class="rw-label">Race week</div><div class="rw-count" id="rwcount"><div><b>–</b><span>days</span></div><div><b>–</b><span>hrs</span></div><div><b>–</b><span>min</span></div><div><b>–</b><span>sec</span></div></div><p class="rw-sub">to the start line · Saturday, Dec 5 · 10:30 · Puerto del Carmen</p><h3>This week</h3>${sessions.map(sessHTML).join('')}<h3>Race-morning checklist</h3>${rwPrep.map((p,i)=>`<div class="session" data-id="rw-prep-${i}"><div class="day">Prep</div><div class="copy"><div class="name" style="font-size:14px">${p[0]}</div></div><input class="check" type="checkbox" aria-label="prep: ${p[0]}"></div>`).join('')}`;
wireSessions(el);
if(window._rwIv)return;
const tick=()=>{const t=RACE-new Date();const b=document.querySelectorAll('#rwcount b');if(!b.length)return;
if(t<=0){b[0].textContent='0';b[1].textContent='0';b[2].textContent='0';b[3].textContent='0';const sub=el.querySelector('.rw-sub');if(sub)sub.textContent=t>-86400000?'RACE DAY — go get it. Start slower than feels right.':'13.1 — in the books. Nice work.';return}
b[0].textContent=Math.floor(t/86400000);b[1].textContent=Math.floor(t/3600000)%24;b[2].textContent=Math.floor(t/60000)%60;b[3].textContent=Math.floor(t/1000)%60};
tick();window._rwIv=setInterval(tick,1000)}
function render(){const now=new Date(),current=Math.max(3,Math.min(14,weekOf(now)));
document.querySelector('#weeks').innerHTML=raw.map(w=>{const [n,range,tue,thu,long,qt,tag,note]=w;
if(n<3)return `<article class="week skipped"><div class="whead"><div class="weekno">${n}</div><div><div class="wtitle">Week ${n}</div><div class="range">${range}</div></div><span class="tag">Skipped · 5K base</span></div></article>`;
const ss=sessionsForWeek(n);
return `<article class="week ${n===current?'current':''}" id="week-${n}"><div class="whead"><div class="weekno">${n}</div><div><div class="wtitle">${n===current?'This week':'Week '+n}</div><div class="range">${range}</div></div><div class="wside">${tag?`<span class="tag">${tag}</span>`:''}${n===current?'':`<button class="wtoggle" aria-expanded="false">+ show week</button>`}</div></div><div class="sessions">${ss.map(sessHTML).join('')}</div>${note?`<p class="note">${note}</p>`:''}</article>`}).join('');
document.querySelectorAll('.week:not(.current) .whead').forEach(h=>{h.addEventListener('click',e=>{const w=h.closest('.week'),b=h.querySelector('.wtoggle'),open=w.classList.toggle('open');if(b){b.setAttribute('aria-expanded',open);b.textContent=open?'− hide week':'+ show week'}})});
wireSessions(document);renderToday();renderRaceWeek(now);update();
if(current>=3&&weekOf(now)<14)setTimeout(()=>document.querySelector(`#week-${current}`)?.scrollIntoView({block:'center'}),100)}
function update(){const total=(14-2)*7,count=[...done].filter(x=>/^w\d/.test(x)).length,p=Math.round((count+14)/(total+14)*100);pct.textContent=p+'%';fill.style.width=p+'%';marker.style.left=p+'%'}
async function load(){const local=localStorage.getItem('lanzarote-done');try{const r=await fetch(API+'?t='+Date.now());if(!r.ok)throw 0;const d=await r.json();if(!d.updatedAt&&local){done=new Set(JSON.parse(local));sync.textContent='saved across devices';render();queueSave();stravaInit();return}done=new Set(d.done||[]);localStorage.setItem('lanzarote-done',JSON.stringify([...done]));sync.textContent='saved across devices';render();stravaInit()}catch{const x=localStorage.getItem('lanzarote-done');if(x)done=new Set(JSON.parse(x));sync.innerHTML=localStorage.getItem('lanzarote-done')?'<span class="offline">offline · showing progress from this device</span>':'<span class="offline">offline · changes save on this device until you are back online</span>';render()}}
function queueSave(){localStorage.setItem('lanzarote-done',JSON.stringify([...done]));sync.textContent='saving…';clearTimeout(saveTimer);saveTimer=setTimeout(save,500)}
async function save(){try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:[...done],updatedAt:new Date().toISOString()})});if(!r.ok)throw 0;sync.textContent='saved across devices'}catch{sync.innerHTML='<span class="offline">offline · saved on this device for now</span>'}}
function matchActivities(acts){const map=allSessions(),byDate={};map.forEach(s=>{if(s.miles)(byDate[dateStr(s.date)]=byDate[dateStr(s.date)]||[]).push(s)});
const matched=[];const used=new Set();
acts.filter(a=>/run/i.test(a.sport_type||a.type||'')).forEach(a=>{const d=(a.start_date_local||'').slice(0,10),mi=(a.distance||0)/1609.34;(byDate[d]||[]).forEach(s=>{if(!used.has(s.id)&&!done.has(s.id)&&mi>=0.8*s.miles){used.add(s.id);matched.push(s.id)}})});
return matched}
async function stravaInit(){const el=document.getElementById('strava');
const qs=new URLSearchParams(location.search);
if(qs.get('strava')==='connected'){el.textContent='Strava connected ✓';history.replaceState(null,'',location.pathname)}
let st;try{st=await (await fetch(API+'/strava/status')).json()}catch{if(!el.textContent)el.innerHTML='<a href="'+API+'/strava/connect">connect Strava</a>';return}
if(!st.configured){if(!el.textContent)el.innerHTML='<span title="Strava app credentials not installed yet">Strava: setup in progress</span>';return}
if(!st.connected){el.innerHTML='<a href="'+API+'/strava/connect">connect Strava</a>';return}
try{const r=await (await fetch(API+'/strava/sync')).json();
if(!r.connected){el.innerHTML='<a href="'+API+'/strava/connect">connect Strava</a>';return}
const matched=matchActivities(r.activities||[]);let added=0;
matched.forEach(id=>{if(!done.has(id)){done.add(id);added++}});
if(added>0){render();queueSave()}
el.innerHTML=`Strava ✓${added?` · ${added} session${added>1?'s':''} auto-checked`:''} · <button id="strava-disc">disconnect</button>`;
document.getElementById('strava-disc').onclick=async()=>{if(!confirm('Disconnect Strava? Auto-check will stop.'))return;try{await fetch(API+'/strava/disconnect',{method:'POST'})}catch{}el.innerHTML='<a href="'+API+'/strava/connect">connect Strava</a>'}
}catch{if(!el.textContent)el.textContent='Strava connected'}}
days.textContent=Math.max(0,Math.ceil((RACE-new Date())/86400000));
document.getElementById('refs').innerHTML=refs.map(x=>`<details class="ref"><summary>${x[0]}</summary><div class="ref-body"><p>${x[1]}</p></div></details>`).join('');
reset.onclick=()=>{if(confirm('Clear every completed workout?')){done=new Set(['week-1-skipped','week-2-skipped']);render();queueSave()}};
load();
</script></body></html>
